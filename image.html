<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지 데이터 수집 | 지도학습 데이터 수집기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #f5f8fd;
      --card: #ffffff;
      --soft: #f8fafc;
      --line: #e2e8f0;
      --text: #1e293b;
      --sub: #64748b;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-weak: #eef4ff;
      --red: #dc2626;
      --green: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      color: var(--sub);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .home-link:hover { background: var(--blue-weak); color: var(--blue); }
    header h1 { margin: 0; font-size: 19px; display: flex; align-items: center; gap: 8px; }
    header h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .save-loc { font-size: 13px; color: var(--sub); margin-right: 4px; }
    .save-loc[hidden], .btn-folder[hidden] { display: none; }
    .save-loc b { color: var(--text); }
    .btn-folder {
      background: var(--blue-weak);
      color: var(--blue);
      border: 1px solid #bfd3fb;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, .35); }
      50% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0); }
    }
    .link-btn {
      background: none;
      color: var(--blue);
      padding: 2px 4px;
      font-size: 13px;
      text-decoration: underline;
    }

    button {
      font: inherit;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background .15s, border-color .15s;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:not(:disabled):hover { background: var(--blue-dark); }
    .btn-outline { background: #fff; color: var(--blue); border: 1px solid var(--line); }
    .btn-outline:not(:disabled):hover { border-color: var(--blue); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger-outline { background: #fff; color: var(--red); border: 1px solid var(--line); }
    .btn-danger-outline:not(:disabled):hover { border-color: var(--red); }

    main { padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 16px; }

    /* 공통 설정 줄 */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .options { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; color: var(--sub); }
    .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .options select, .options input.start-in {
      font: inherit;
      font-size: 14px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }
    .options input.start-in { width: 80px; }
    .badge {
      background: var(--blue-weak);
      color: var(--blue);
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      font-weight: 600;
    }
    input:focus, select:focus { outline: 2px solid var(--blue); border-color: transparent; }

    /* 다운로드 전 경고창 */
    .modal-back {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(15, 23, 42, .45);
    }
    .modal-back[hidden] { display: none; }
    .modal {
      width: min(100%, 440px);
      padding: 26px 26px 22px;
      background: #fff;
      border-radius: 18px;
      border-top: 6px solid var(--blue);
      box-shadow: 0 24px 60px rgba(15, 23, 42, .3);
      font-size: 15px;
      line-height: 1.6;
      animation: pop .18s ease-out;
    }
    @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: var(--blue-weak);
      display: grid;
      place-items: center;
      font-size: 26px;
    }
    .modal h2 { margin: 0 0 12px; font-size: 20px; text-align: center; color: var(--blue); }
    .modal p { margin: 0 0 8px; }
    .modal ul { margin: 0 0 10px; padding-left: 20px; color: var(--text); }
    .modal li { margin: 2px 0; }
    .modal-sub { color: var(--sub); font-size: 14px; }
    .modal-sum {
      margin-top: 10px !important;
      padding: 8px 12px;
      background: var(--soft);
      border-radius: 10px;
      font-size: 13px;
      color: var(--sub);
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
    .modal-actions button { flex: 1; }

    /* 클래스/범주 한 줄 */
    .class-row {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .04);
    }
    .row-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .row-no {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
    }
    .row-no .dot { width: 10px; height: 10px; border-radius: 50%; }
    .row-head input.cls-name {
      flex: 1;
      max-width: 360px;
      min-width: 0;
      font: inherit;
      font-weight: 700;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
    }
    .row-head .spacer { flex: 1; }
    .row-del { background: none; color: var(--sub); padding: 6px 10px; font-size: 13px; }
    .row-del:hover { background: #fef2f2; color: var(--red); }

    .row-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 12px;
    }
    .box {
      display: flex;
      flex-direction: column;
      height: 420px;
      min-height: 0;
      padding: 12px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .box h3 {
      margin: 0 0 10px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .empty-msg { color: var(--sub); font-size: 14px; text-align: center; line-height: 1.6; }
    .hint { font-size: 12px; color: var(--sub); margin-top: 8px; text-align: center; }

    /* 사진 찍기 */
    .cam-box {
      position: relative;
      flex: 1;
      min-height: 0;
      aspect-ratio: 1;
      max-width: 100%;
      align-self: center;
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cam-box video { width: 100%; height: 100%; object-fit: cover; display: none; }
    .cam-box video.mirror { transform: scaleX(-1); }
    .cam-off-msg { color: #94a3b8; font-size: 14px; }
    .flash {
      position: absolute; inset: 0;
      background: #fff; opacity: 0;
      pointer-events: none;
      transition: opacity .15s;
    }
    .cam-row { display: flex; gap: 8px; margin-top: 10px; }
    .cam-row button { flex: 1; }
    .cap-btn { user-select: none; touch-action: none; }
    .cap-btn.recording { background: var(--green); }

    /* 찍은 사진 */
    .gallery {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 8px;
      align-content: start;
      padding: 2px;
    }
    .gallery .empty-msg { grid-column: 1 / -1; padding: 40px 0; }
    .thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 3px solid transparent;
      background: #eef2f7;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb.selected { border-color: var(--blue); }
    .thumb .num {
      position: absolute;
      left: 3px;
      bottom: 3px;
      background: rgba(15, 23, 42, .65);
      color: #fff;
      font-size: 11px;
      padding: 0 5px;
      border-radius: 5px;
    }

    /* 사진 확인 */
    .preview-box {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px dashed var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .preview-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .preview-controls button { padding: 9px 12px; }
    .preview-info { font-size: 13px; color: var(--sub); font-weight: 600; }

    #addRowBtn {
      width: 100%;
      padding: 18px;
      font-size: 17px;
      font-weight: 700;
      border: 2px solid var(--blue);
      background: var(--blue);
      color: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(37, 99, 235, .25);
    }
    #addRowBtn:hover { background: var(--blue-dark); border-color: var(--blue-dark); }

    .toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      max-width: min(90vw, 560px);
      background: rgba(15, 23, 42, .92);
      color: #fff;
      padding: 18px 28px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      white-space: pre-line;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      z-index: 1000;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 900px) {
      header { position: static; flex-wrap: wrap; padding: 10px 16px; }
      main { padding: 12px 16px 32px; }
      .row-grid { grid-template-columns: 1fr; }
      .box { height: auto; }
      .cam-box { flex: none; width: 100%; }
      .gallery { max-height: 320px; min-height: 120px; }
      .preview-box { min-height: 260px; flex: none; }
      .row-head { flex-wrap: wrap; }
      .row-head input.cls-name { max-width: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a class="home-link" href="./">← 홈</a>
      <h1><span class="dot"></span>이미지 데이터 수집</h1>
    </div>
    <div class="header-actions">
      <button class="btn-folder" id="connectBtn" hidden>📁 저장 폴더 연결</button>
      <span class="save-loc" id="folderStatus" hidden>
        ✅ 저장 폴더: <b id="folderName"></b>
        <button class="link-btn" id="changeLocBtn">변경</button>
      </span>
      <button class="btn-primary" id="downloadBtn" disabled>⬇ 다운로드</button>
      <button class="btn-danger-outline" id="resetBtn">↺ 리셋</button>
    </div>
  </header>

  <main>
    <!-- 모든 클래스/범주에 같이 쓰는 설정 -->
    <div class="toolbar">
      <div class="options">
        <label>사진 크기
          <select id="sizeSel">
            <option value="224" selected>224px</option>
            <option value="400">400px</option>
            <option value="640">640px</option>
          </select>
        </label>
        <label><input type="checkbox" id="mirrorChk" checked> 좌우 반전</label>
      </div>
      <span class="badge" id="totalBadge">클래스/범주 1개 · 총 0장</span>
    </div>

    <div id="rows"></div>

    <button id="addRowBtn">＋ 클래스/범주 추가</button>
  </main>

  <!-- 다운로드 전 경고창 -->
  <div class="modal-back" id="checkModal" hidden>
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="checkTitle" aria-describedby="checkBody">
      <div class="modal-icon">⚠️</div>
      <h2 id="checkTitle">다운로드 전에 확인하세요!</h2>
      <div id="checkBody">
        <p>각 클래스/범주의 <b>특징·패턴을 잘 나타내는 사진</b>인지 확인하세요.</p>
        <ul>
          <li>흐리거나 흔들린 사진</li>
          <li>대상이 잘 안 보이거나 잘린 사진</li>
          <li>다른 클래스/범주와 헷갈리는 사진</li>
        </ul>
        <p class="modal-sub">이런 사진은 🗑 삭제한 뒤 다운로드하면 더 좋은 인공지능을 만들 수 있어요.</p>
        <p class="modal-sum" id="checkSum"></p>
      </div>
      <div class="modal-actions">
        <button class="btn-outline" id="checkBack">다시 확인할게요</button>
        <button class="btn-primary" id="checkOk">확인했어요, 다운로드</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===== 상태 =====
    let classes = [];          // { id, name, images: [dataUrl], sel, el }
    let nextId = 1;
    let lastRow = null;        // 키보드로 조작할 클래스/범주
    let stream = null;
    let holdTimer = null, burstTimer = null;
    const COLORS = ['#2563eb', '#0ea5e9', '#7c3aed', '#16a34a', '#f59e0b', '#db2777', '#0d9488', '#64748b'];

    const $ = (id) => document.getElementById(id);
    const rowsEl = $('rows');
    const getClass = (id) => classes.find(c => c.id === id);
    const totalCount = () => classes.reduce((n, c) => n + c.images.length, 0);
    const label = (c) => c.name.trim() || '클래스/범주 ' + (classes.indexOf(c) + 1);

    // 저장 시작 번호: 항상 1번부터 (폴더에 이미 사진이 있으면 저장할 때 자동으로 이어서)
    function startNum() { return 1; }

    // ===== 클래스/범주 한 줄 만들기 =====
    function addRow() {
      const c = { id: nextId++, name: '', images: [], sel: -1, el: {} };
      classes.push(c);

      const row = document.createElement('section');
      row.className = 'class-row';
      row.innerHTML =
        '<div class="row-head">' +
          '<span class="row-no"><span class="dot"></span><span class="no-text"></span></span>' +
          '<input type="text" class="cls-name" maxlength="40" placeholder="이름을 입력하세요 (예: 사과)">' +
          '<span class="spacer"></span>' +
          '<button class="row-del" title="이 클래스/범주 삭제">✕ 삭제</button>' +
        '</div>' +
        '<div class="row-grid">' +
          '<div class="box">' +
            '<h3>사진 찍기</h3>' +
            '<div class="cam-box">' +
              '<video autoplay playsinline muted></video>' +
              '<div class="cam-off-msg">카메라가 꺼져 있어요</div>' +
              '<div class="flash"></div>' +
            '</div>' +
            '<div class="cam-row">' +
              '<button class="btn-outline cam-btn">카메라 켜기</button>' +
              '<button class="btn-primary cap-btn" disabled>사진 찍기</button>' +
            '</div>' +
            '<div class="hint">한 번 누르면 1장, 길게 누르면 연속으로 찍혀요.</div>' +
          '</div>' +
          '<div class="box">' +
            '<h3>찍은 사진 <span class="badge cnt">0장</span></h3>' +
            '<div class="gallery"></div>' +
          '</div>' +
          '<div class="box">' +
            '<h3>사진 확인 <span class="preview-info"></span></h3>' +
            '<div class="preview-box"></div>' +
            '<div class="preview-controls">' +
              '<button class="btn-outline prev-btn" disabled>◀ 이전</button>' +
              '<button class="btn-danger del-btn" disabled>🗑 삭제</button>' +
              '<button class="btn-outline next-btn" disabled>다음 ▶</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      rowsEl.appendChild(row);

      const q = (s) => row.querySelector(s);
      c.el = {
        row, noText: q('.no-text'), dot: q('.row-no .dot'), name: q('.cls-name'),
        video: q('video'), camOff: q('.cam-off-msg'), flash: q('.flash'),
        camBtn: q('.cam-btn'), capBtn: q('.cap-btn'),
        cnt: q('.cnt'), gallery: q('.gallery'),
        info: q('.preview-info'), preview: q('.preview-box'),
        prev: q('.prev-btn'), del: q('.del-btn'), next: q('.next-btn')
      };

      c.el.name.addEventListener('input', () => { c.name = c.el.name.value; renderPreview(c); });
      row.addEventListener('pointerdown', () => { lastRow = c; });
      q('.row-del').addEventListener('click', () => deleteRow(c));
      c.el.camBtn.addEventListener('click', () => stream ? stopCamera() : startCamera());
      c.el.capBtn.addEventListener('pointerdown', (e) => startPress(e, c));
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => c.el.capBtn.addEventListener(ev, stopBurst));
      c.el.prev.addEventListener('click', () => move(c, -1));
      c.el.next.addEventListener('click', () => move(c, 1));
      c.el.del.addEventListener('click', () => deleteSelected(c));

      c.el.video.classList.toggle('mirror', $('mirrorChk').checked);
      attachCamera(c);
      renderGallery(c);
      renumber();
      return c;
    }

    function deleteRow(c) {
      if (classes.length === 1) { showToast('클래스/범주는 하나 이상 있어야 해요.'); return; }
      if (c.images.length > 0 && !confirm('"' + label(c) + '"와(과) 찍은 사진 ' + c.images.length + '장이 지워져요. 삭제할까요?')) return;
      c.el.row.remove();
      classes.splice(classes.indexOf(c), 1);
      if (lastRow === c) lastRow = null;
      renumber();
    }

    // 줄 번호·색·전체 개수 다시 표시
    function renumber() {
      classes.forEach((c, i) => {
        c.el.noText.textContent = '클래스/범주 ' + (i + 1);
        c.el.dot.style.background = COLORS[i % COLORS.length];
        renderPreview(c);
      });
      renderTotal();
    }

    function renderTotal() {
      $('totalBadge').textContent = '클래스/범주 ' + classes.length + '개 · 총 ' + totalCount() + '장';
      updateDownloadBtn();
    }

    $('addRowBtn').addEventListener('click', () => {
      const c = addRow();
      c.el.row.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setTimeout(() => c.el.name.focus({ preventScroll: true }), 300);
    });

    // ===== 카메라 (모든 줄이 같은 웹캠을 같이 씀) =====
    function attachCamera(c) {
      const on = !!stream;
      c.el.video.srcObject = on ? stream : null;
      c.el.video.style.display = on ? 'block' : 'none';
      c.el.camOff.style.display = on ? 'none' : 'block';
      c.el.camBtn.textContent = on ? '카메라 끄기' : '카메라 켜기';
      c.el.capBtn.disabled = !on;
    }

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast('이 브라우저는 웹캠을 지원하지 않아요. 크롬을 사용해 주세요.');
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        classes.forEach(attachCamera);
      } catch (err) {
        console.error(err);
        if (err.name === 'NotAllowedError') {
          showToast('카메라 권한이 막혀 있어요. 주소창 왼쪽 아이콘 → 사이트 설정에서 카메라를 "허용"으로 바꾼 뒤 새로고침해 주세요.');
        } else if (err.name === 'NotFoundError') {
          showToast('연결된 웹캠을 찾을 수 없어요.');
        } else if (err.name === 'NotReadableError') {
          showToast('다른 프로그램이 카메라를 사용 중이에요.');
        } else {
          showToast('카메라를 켤 수 없어요: ' + err.message);
        }
      }
    }

    function stopCamera() {
      stopBurst();
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null;
      classes.forEach(attachCamera);
    }

    $('mirrorChk').addEventListener('change', (e) => {
      classes.forEach(c => c.el.video.classList.toggle('mirror', e.target.checked));
    });

    // ===== 촬영 =====
    function capture(c) {
      const video = c.el.video;
      if (!stream || !video.videoWidth) return;
      const size = parseInt($('sizeSel').value, 10);
      const vw = video.videoWidth, vh = video.videoHeight;
      const side = Math.min(vw, vh);
      const sx = (vw - side) / 2, sy = (vh - side) / 2;

      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      if ($('mirrorChk').checked) {
        ctx.translate(size, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, sx, sy, side, side, 0, 0, size, size);

      c.images.push(canvas.toDataURL('image/jpeg', 0.92));
      c.el.flash.style.opacity = '0.6';
      setTimeout(() => c.el.flash.style.opacity = '0', 80);
      renderGallery(c);
      renderTotal();
      c.el.gallery.scrollTop = c.el.gallery.scrollHeight;
    }

    // 한 번 클릭 = 1장, 길게 누르기 = 연속 촬영
    function startPress(e, c) {
      if (c.el.capBtn.disabled) return;
      e.preventDefault();
      stopBurst();
      capture(c);
      holdTimer = setTimeout(() => {
        c.el.capBtn.classList.add('recording');
        c.el.capBtn.textContent = '연속 촬영 중...';
        burstTimer = setInterval(() => capture(c), 150);
      }, 450);
    }
    function stopBurst() {
      clearTimeout(holdTimer);
      clearInterval(burstTimer);
      holdTimer = burstTimer = null;
      classes.forEach(c => {
        c.el.capBtn.classList.remove('recording');
        c.el.capBtn.textContent = '사진 찍기';
      });
    }

    // ===== 찍은 사진 =====
    function renderGallery(c) {
      c.el.cnt.textContent = c.images.length + '장';
      const g = c.el.gallery;
      g.innerHTML = '';
      if (c.images.length === 0) {
        g.innerHTML = '<div class="empty-msg">아직 찍은 사진이 없어요.</div>';
      } else {
        const start = startNum();
        c.images.forEach((url, i) => {
          const t = document.createElement('div');
          t.className = 'thumb' + (i === c.sel ? ' selected' : '');
          t.innerHTML = '<img src="' + url + '" alt=""><span class="num">' + (start + i) + '</span>';
          t.addEventListener('click', () => select(c, i));
          g.appendChild(t);
        });
      }
      renderPreview(c);
    }

    function select(c, i) {
      c.sel = i;
      lastRow = c;
      renderGallery(c);
      const t = c.el.gallery.children[i];
      if (t) t.scrollIntoView({ block: 'nearest' });
    }

    // ===== 사진 확인 =====
    function renderPreview(c) {
      const has = c.sel >= 0 && c.sel < c.images.length;
      c.el.del.disabled = !has;
      c.el.prev.disabled = !has || c.sel === 0;
      c.el.next.disabled = !has || c.sel === c.images.length - 1;
      if (!has) {
        c.sel = -1;
        c.el.info.textContent = '';
        c.el.preview.innerHTML = '<div class="empty-msg">찍은 사진을 클릭하면<br>여기에서 크게 볼 수 있어요.</div>';
        return;
      }
      c.el.info.textContent = label(c) + ' · ' + (c.sel + 1) + ' / ' + c.images.length;
      c.el.preview.innerHTML = '<img src="' + c.images[c.sel] + '" alt="">';
    }

    function move(c, d) {
      const i = c.sel + d;
      if (c.sel >= 0 && i >= 0 && i < c.images.length) select(c, i);
    }

    function deleteSelected(c) {
      if (c.sel < 0) return;
      c.images.splice(c.sel, 1);
      if (c.images.length === 0) c.sel = -1;
      else if (c.sel >= c.images.length) c.sel = c.images.length - 1;
      renderGallery(c);
      renderTotal();
      showToast('삭제했어요');
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      const c = lastRow;
      if (!c || c.sel < 0 || !classes.includes(c)) return;
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(c); }
      if (e.key === 'ArrowLeft') move(c, -1);
      if (e.key === 'ArrowRight') move(c, 1);
    });

    // ===== 저장 도우미 =====
    function safeName(name) {
      return name.trim().replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ') || '이미지';
    }

    function dataUrlToBlob(dataUrl) {
      const [head, b64] = dataUrl.split(',');
      const mime = head.match(/:(.*?);/)[1];
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    // ===== 저장 위치 기억 (처음 한 번만 고르면 다음부터 자동 저장) =====
    const DB_NAME = 'ai-image-collector', STORE = 'handles';
    function openDb() {
      return new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(STORE);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    async function idbGet(key) {
      try {
        const db = await openDb();
        return await new Promise((res, rej) => {
          const q = db.transaction(STORE).objectStore(STORE).get(key);
          q.onsuccess = () => res(q.result || null);
          q.onerror = () => rej(q.error);
        });
      } catch (e) { return null; }
    }
    async function idbSet(key, val) {
      try {
        const db = await openDb();
        await new Promise((res, rej) => {
          const t = db.transaction(STORE, 'readwrite');
          t.objectStore(STORE).put(val, key);
          t.oncomplete = res;
          t.onerror = () => rej(t.error);
        });
      } catch (e) { /* 저장 못 해도 다음에 다시 고르면 됨 */ }
    }

    // ===== 저장 폴더 연결 =====
    const FS_OK = 'showDirectoryPicker' in window;
    let saveDir = null;      // 연결되어 쓰기 권한이 있는 폴더
    let savedDir = null;     // 기억된 폴더(권한 재확인 필요할 수 있음)

    function renderFolderUI() {
      if (!FS_OK) return;
      const btn = $('connectBtn');
      if (saveDir) {
        btn.hidden = true;
        $('folderStatus').hidden = false;
        $('folderName').textContent = saveDir.name;
      } else {
        btn.hidden = false;
        $('folderStatus').hidden = true;
        btn.textContent = savedDir ? '📁 저장 폴더 다시 연결' : '📁 저장 폴더 연결';
      }
      updateDownloadBtn();
    }

    // 고른 폴더를 그대로 연결 (그 안에 클래스/범주 이름 폴더가 만들어짐)
    async function createAndConnect() {
      const dir = await window.showDirectoryPicker({ id: 'ai-image-data', mode: 'readwrite', startIn: 'desktop' });
      saveDir = savedDir = dir;
      await idbSet('root', dir);
      renderFolderUI();
      showToast('"' + dir.name + '" 폴더를 연결했어요. 이 안에 클래스/범주 이름 폴더로 저장돼요.');
    }

    async function connectFolder() {
      try {
        // 예전에 연결한 폴더가 있으면 권한만 다시 받기
        if (savedDir && !saveDir) {
          const p = await savedDir.requestPermission({ mode: 'readwrite' });
          if (p === 'granted') {
            saveDir = savedDir;
            renderFolderUI();
            showToast('"' + saveDir.name + '" 폴더를 다시 연결했어요.');
            return;
          }
        }
        await createAndConnect();
      } catch (e) {
        if (e.name === 'AbortError') return;
        if (e.name === 'SecurityError' || e.name === 'NotAllowedError') {
          showToast('이 폴더는 선택할 수 없어요. 바탕화면 안에 새 폴더를 만들거나 다른 위치를 골라 주세요.');
        } else {
          showToast('폴더를 연결할 수 없어요: ' + e.message);
        }
      }
    }

    $('connectBtn').addEventListener('click', connectFolder);
    $('changeLocBtn').addEventListener('click', async () => {
      try { await createAndConnect(); }
      catch (e) { if (e.name !== 'AbortError') showToast('위치를 바꿀 수 없어요: ' + e.message); }
    });

    function updateDownloadBtn() {
      $('downloadBtn').disabled = totalCount() === 0 || (FS_OK && !saveDir);
    }

    // 시작할 때 기억된 폴더 확인
    (async () => {
      if (!FS_OK) return;
      savedDir = await idbGet('root');
      if (savedDir) {
        try {
          if (await savedDir.queryPermission({ mode: 'readwrite' }) === 'granted') saveDir = savedDir;
        } catch (e) { savedDir = null; }
      }
      renderFolderUI();
    })();

    // 같은 이름 폴더가 있으면 그 폴더, 없으면 null
    async function findFolder(root, name) {
      try { return await root.getDirectoryHandle(name); }
      catch (e) {
        if (e.name === 'NotFoundError' || e.name === 'TypeMismatchError') return null;
        throw e;
      }
    }

    // 폴더 안의 "숫자.jpg" 중 가장 큰 번호 (없으면 0)
    async function lastNumber(dir) {
      let max = 0;
      for await (const fileName of dir.keys()) {
        const m = /^(\d+)\.jpe?g$/i.exec(fileName);
        if (m) max = Math.max(max, parseInt(m[1], 10));
      }
      return max;
    }

    // ===== 다운로드: 클래스/범주마다 이름 폴더에 1.jpg, 2.jpg ... 로 한꺼번에 저장 =====
    async function saveAll() {
      const targets = classes.filter(c => c.images.length > 0);
      if (targets.length === 0) return;

      // 사진이 있는 클래스/범주는 이름이 있어야 하고, 이름이 겹치면 안 됨
      const noName = targets.find(c => !c.name.trim());
      if (noName) {
        noName.el.row.scrollIntoView({ behavior: 'smooth', block: 'start' });
        noName.el.name.focus({ preventScroll: true });
        showToast('"' + label(noName) + '"의 이름을 입력해 주세요.\n사진이 있는 클래스/범주는 이름이 있어야 저장할 수 있어요.');
        return;
      }
      const names = targets.map(c => safeName(c.name));
      const dup = names.find((n, i) => names.indexOf(n) !== i);
      if (dup) { showToast('클래스/범주 이름 "' + dup + '"이(가) 겹쳐요. 이름을 다르게 바꿔 주세요.'); return; }
      if (FS_OK && !saveDir) { showToast('먼저 위쪽의 "저장 폴더 연결" 버튼을 눌러 주세요.'); return; }

      // 다운로드 전 경고창: 특징·패턴을 잘 나타내는 사진인지 확인
      $('checkSum').textContent = '저장할 사진: ' + targets.map((c, k) => names[k] + ' ' + c.images.length + '장').join(' · ');
      if (!(await askCheck())) return;

      const start0 = startNum();
      const total = totalCount();
      const btn = $('downloadBtn');

      // 1순위: 폴더에 직접 저장 (크롬·엣지 PC) → 압축 풀기 필요 없음
      if (FS_OK) {
        if (!saveDir) {
          showToast('먼저 위쪽의 "저장 폴더 연결" 버튼을 눌러 주세요.');
          return;
        }
        const root = saveDir;
        btn.disabled = true;
        btn.textContent = '저장 중...';
        try {
          // 클래스/범주마다 저장할 폴더와 시작 번호 정하기
          const plan = [];
          for (let k = 0; k < targets.length; k++) {
            const c = targets[k], name = names[k];
            // 연결한 폴더 이름이 클래스/범주 이름과 같으면 그 폴더 자체에 저장 (우리반 > 우리반 처럼 겹치지 않게)
            const isRoot = root.name === name;
            const dir = isRoot ? root : await findFolder(root, name);
            const max = dir ? await lastNumber(dir) : 0;
            const start = dir && start0 <= max ? max + 1 : start0;   // 이미 있는 번호 다음부터 이어서
            plan.push({ c, name, dir, isRoot, start, end: start + c.images.length - 1, exists: !!dir, max });
          }

          // 이미 있는 폴더가 있으면 저장 전에 한 번 물어보기
          const existing = plan.filter(p => p.exists);
          if (existing.length > 0) {
            const fresh = plan.filter(p => !p.exists);
            let msg = '이미 있는 폴더에는 이어서 저장해요.\n\n'
              + existing.map(p => '• ' + p.name + ' (마지막 ' + p.max + '번) → ' + p.start + '번~' + p.end + '번').join('\n');
            if (fresh.length > 0) {
              msg += '\n\n새로 만드는 폴더:\n' + fresh.map(p => '• ' + p.name + ' → ' + p.start + '번~' + p.end + '번').join('\n');
            }
            msg += '\n\n저장할까요?';
            if (!confirm(msg)) {
              showToast('저장을 취소했어요.');
              return;
            }
          }

          let done = 0;
          for (const p of plan) {
            const dir = p.dir || await root.getDirectoryHandle(p.name, { create: true });
            for (let i = 0; i < p.c.images.length; i++) {
              const fh = await dir.getFileHandle((p.start + i) + '.jpg', { create: true });
              const w = await fh.createWritable();
              await w.write(dataUrlToBlob(p.c.images[i]));
              await w.close();
              btn.textContent = '저장 중... ' + (++done) + '/' + total;
            }
          }
          showToast('클래스/범주 ' + plan.length + '개, ' + total + '장을 "' + root.name + '" 폴더에 저장했어요.\n'
            + plan.map(p => (p.isRoot ? p.name + '(연결한 폴더)' : p.name) + ' ' + p.start + '~' + p.end + '번').join(' · '));
        } catch (err) {
          console.error(err);
          if (err.name === 'NotFoundError') {
            await idbSet('root', null);
            saveDir = savedDir = null;
            showToast('저장 폴더를 찾을 수 없어요. 폴더를 다시 연결해 주세요.');
          } else if (err.name === 'NotAllowedError') {
            saveDir = null;
            showToast('폴더 권한이 꺼졌어요. "저장 폴더 다시 연결"을 눌러 주세요.');
          } else {
            showToast('저장 중 오류가 났어요: ' + err.message);
          }
        } finally {
          btn.textContent = '⬇ 다운로드';
          renderFolderUI();
        }
        return;
      }

      // 2순위: ZIP 다운로드 (폴더 저장을 지원하지 않는 브라우저) — ZIP 안에 클래스/범주별 폴더
      btn.disabled = true;
      btn.textContent = '압축 중...';
      try {
        const zip = new JSZip();
        targets.forEach((c, k) => {
          const folder = zip.folder(names[k]);
          c.images.forEach((dataUrl, i) => {
            folder.file((start0 + i) + '.jpg', dataUrl.split(',')[1], { base64: true });
          });
        });
        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (targets.length === 1 ? names[0] : '이미지 데이터') + '.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showToast('클래스/범주 ' + targets.length + '개, ' + total + '장을 이름별 폴더로 저장했어요.\n(' + names.join(', ') + ')');
      } catch (err) {
        console.error(err);
        showToast('다운로드 중 오류가 났어요: ' + err.message);
      } finally {
        btn.textContent = '⬇ 다운로드';
        updateDownloadBtn();
      }
    }

    // 경고창 열기 → "확인했어요"면 true, "다시 확인할게요"/Esc/바깥 클릭이면 false
    function askCheck() {
      const back = $('checkModal');
      $('toast').classList.remove('show');
      back.hidden = false;
      $('checkOk').focus();
      return new Promise(resolve => {
        const done = (ok) => {
          back.hidden = true;
          $('checkOk').onclick = $('checkBack').onclick = back.onclick = null;
          document.removeEventListener('keydown', onKey, true);
          if (!ok) showToast('사진을 다시 살펴보고 다운로드해 주세요.');
          resolve(ok);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
        };
        $('checkOk').onclick = () => done(true);
        $('checkBack').onclick = () => done(false);
        back.onclick = (e) => { if (e.target === back) done(false); };
        document.addEventListener('keydown', onKey, true);
      });
    }

    $('downloadBtn').addEventListener('click', saveAll);

    // ===== 리셋 =====
    $('resetBtn').addEventListener('click', () => {
      const n = totalCount();
      if ((n > 0 || classes.length > 1) && !confirm('클래스/범주 ' + classes.length + '개와 찍은 사진 ' + n + '장이 모두 지워져요. 처음부터 다시 할까요?')) return;
      stopBurst();
      classes.forEach(c => c.el.row.remove());
      classes = [];
      lastRow = null;
      addRow();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast('초기화했어요');
    });

    // ===== 알림 =====
    let toastTimer;
    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // 다른 페이지로 이동하거나 닫을 때 경고
    window.addEventListener('beforeunload', (e) => {
      if (totalCount() > 0) { e.preventDefault(); e.returnValue = ''; }
    });

    // ===== 시작: 클래스/범주 1개 =====
    addRow();
  </script>
</body>
</html>
