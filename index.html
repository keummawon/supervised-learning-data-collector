<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지도학습 데이터 수집기</title>
  <style>
    :root {
      --bg: #f5f8fd;
      --card: #ffffff;
      --line: #e2e8f0;
      --text: #1e293b;
      --sub: #64748b;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-weak: #eef4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(1200px 500px at 50% -200px, #dbe7ff 0%, rgba(219, 231, 255, 0) 70%),
        var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 28px;
      font-weight: 700;
      font-size: 16px;
    }
    header .logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--blue);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 15px;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    .hero { text-align: center; margin-bottom: 44px; }
    .hero .eyebrow {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--blue-weak);
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .hero h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.02em; }
    .hero p { margin: 0; color: var(--sub); font-size: 16px; line-height: 1.6; }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 28px 24px 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
      transition: transform .15s, box-shadow .15s, border-color .15s;
      cursor: pointer;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: #bfd3fb;
      box-shadow: 0 12px 28px rgba(37, 99, 235, .12);
      outline: none;
    }
    .card .icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--blue-weak);
      color: var(--blue);
      display: grid;
      place-items: center;
    }
    .card .icon svg { width: 28px; height: 28px; }
    .card h2 { margin: 4px 0 0; font-size: 21px; }
    .card p { margin: 0; color: var(--sub); font-size: 14px; line-height: 1.6; flex: 1; }
    .card .go {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--blue);
    }
    .card.soon { cursor: default; }
    .card.soon .icon { background: #f1f5f9; color: #94a3b8; }
    .card.soon .go { color: #94a3b8; }
    .card.soon:hover { transform: none; box-shadow: 0 1px 3px rgba(15, 23, 42, .05); border-color: var(--line); }
    .lock {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #94a3b8;
      display: grid;
      place-items: center;
    }
    .lock svg { width: 17px; height: 17px; }
    .card.soon h2, .card.soon p { color: #94a3b8; }

    footer { text-align: center; padding: 20px; color: var(--sub); font-size: 13px; }
    .unlock-btn {
      font: inherit;
      font-size: 13px;
      background: none;
      border: none;
      border-radius: 6px;
      padding: 2px 5px;
      margin-left: 2px;
      cursor: pointer;
      opacity: .55;
      transition: opacity .15s, background .15s;
    }
    .unlock-btn:hover, .unlock-btn:focus-visible { opacity: 1; background: var(--blue-weak); outline: none; }
    .lock[hidden] { display: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, .92);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 760px) {
      main { padding: 28px 16px 48px; }
      header { padding: 14px 16px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">AI</span>
    지도학습 데이터 수집기
  </header>

  <main>
    <section class="hero">
      <span class="eyebrow">Supervised Learning Data</span>
      <h1>어떤 데이터를 모을까요?</h1>
      <p>인공지능에게 가르칠 데이터를 클래스별로 모아요.<br>수집할 데이터 종류를 골라 주세요.</p>
    </section>

    <section class="cards">
      <a class="card" href="image.html">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg>
        </div>
        <h2>이미지</h2>
        <p>웹캠으로 사진을 찍어 클래스 이름 폴더에 1.jpg, 2.jpg … 로 저장해요.</p>
        <span class="go">시작하기 →</span>
      </a>

      <div class="card soon lockable" role="button" tabindex="0" data-name="음성" data-href="voice.html" aria-label="음성 (잠김)">
        <span class="lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v5"/></svg>
        </div>
        <h2>음성</h2>
        <p>마이크로 소리를 녹음해 클래스별로 모아요.</p>
        <span class="go">🔒 잠겨 있어요</span>
      </div>

      <div class="card soon lockable" role="button" tabindex="0" data-name="텍스트" data-href="text.html" aria-label="텍스트 (잠김)">
        <span class="lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
        </div>
        <h2>텍스트</h2>
        <p>문장을 입력해 클래스(감정, 주제 등)별로 모아요.</p>
        <span class="go">🔒 잠겨 있어요</span>
      </div>
    </section>
  </main>

  <footer>
    사진과 데이터는 내 컴퓨터에만 저장돼요.
    <button class="unlock-btn" id="unlockBtn" title="잠금 해제" aria-label="잠금 해제">🔒</button>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }
    // ===== 잠금 / 잠금 해제 (이 브라우저에 기억) =====
    const KEY = 'sl-collector-unlocked';
    const unlockBtn = document.getElementById('unlockBtn');

    function isUnlocked() {
      try { return localStorage.getItem(KEY) === '1'; } catch (e) { return unlockedMemo; }
    }
    let unlockedMemo = false;   // 저장소를 못 쓰는 브라우저용
    function setUnlocked(v) {
      unlockedMemo = v;
      try { v ? localStorage.setItem(KEY, '1') : localStorage.removeItem(KEY); } catch (e) { /* 이번 화면에서만 적용 */ }
      renderLocks();
    }

    function renderLocks() {
      const u = isUnlocked();
      document.querySelectorAll('.card.lockable').forEach(card => {
        card.classList.toggle('soon', !u);
        card.querySelector('.lock').hidden = u;
        card.querySelector('.go').textContent = u ? '시작하기 →' : '🔒 잠겨 있어요';
        card.setAttribute('aria-label', card.dataset.name + (u ? '' : ' (잠김)'));
      });
      unlockBtn.textContent = u ? '🔓' : '🔒';
      unlockBtn.title = u ? '다시 잠그기' : '잠금 해제';
      unlockBtn.setAttribute('aria-label', unlockBtn.title);
    }

    async function openCard(card) {
      if (!isUnlocked()) {
        showToast('🔒 ' + card.dataset.name + ' 수집기는 아직 잠겨 있어요.');
        return;
      }
      // 페이지가 있으면 이동, 아직 없으면 안내
      try {
        const r = await fetch(card.dataset.href, { method: 'HEAD', cache: 'no-store' });
        if (r.ok) { location.href = card.dataset.href; return; }
      } catch (e) { /* 아래 안내 */ }
      showToast(card.dataset.name + ' 수집기 페이지는 아직 만들지 않았어요.');
    }

    document.querySelectorAll('.card.lockable').forEach(card => {
      card.addEventListener('click', () => openCard(card));
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(card); } });
    });

    unlockBtn.addEventListener('click', () => {
      const next = !isUnlocked();
      setUnlocked(next);
      showToast(next ? '🔓 음성·텍스트 잠금을 풀었어요.' : '🔒 다시 잠갔어요.');
    });

    renderLocks();
  </script>
</body>
</html>
